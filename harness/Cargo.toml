[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
globset = "0.4"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "time", "signal", "io-util", "sync"] }

sanborn-core = { path = "crates/sanborn-core" }
sanborn-models = { path = "crates/sanborn-models" }
sanborn-tools = { path = "crates/sanborn-tools" }
sanborn-laya = { path = "crates/sanborn-laya" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
